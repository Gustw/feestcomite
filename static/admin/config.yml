backend:
  name: github
  repo: gustw/feestcomite
  branch: master
  base_url: https://sveltia-cms-auth.gust-wittevrongel.workers.dev

media_folder: "static/images/uploads"
public_folder: "/images/uploads"


collections:
  - name: "evenementen"
    label: "Evenementen"
    folder: "content/evenementen"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Startdatum", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Einddatum (optioneel, voor meerdaagse events)", name: "einddatum", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - label: "Type evenement"
        name: "evenement_type"
        widget: "select"
        options:
          - { label: "Kermis", value: "kermis" }
          - { label: "Ommegang", value: "ommegang" }
          - { label: "Winterdorp", value: "winterdorp" }
      - { label: "Locatie", name: "locatie", widget: "string", required: false }
      - { label: "Ondertitel", name: "subtitle", widget: "string", required: false }
      - { label: "Afbeelding", name: "image", widget: "image", required: false }
      - label: "Programma"
        name: "programma"
        widget: "list"
        required: false
        fields:
          - { label: "Dag (bv. Vrijdag 12 sept)", name: "dag", widget: "string", required: false }
          - { label: "Tijd", name: "tijd", widget: "string" }
          - { label: "Beschrijving", name: "beschrijving", widget: "string" }
      - label: "Links"
        name: "links"
        widget: "list"
        required: false
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "URL", name: "url", widget: "string" }
      - label: "Foto's"
        name: "fotos"
        widget: "list"
        required: false
        fields:
          - { label: "Foto", name: "image", widget: "image" }
          - { label: "Bijschrift", name: "caption", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Inhoud", name: "body", widget: "markdown" }

  - name: "paginas"
    label: "Pagina's"
    files:
      - label: "Homepage"
        name: "home"
        file: "content/_index.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Ondertitel", name: "subtitle", widget: "string", required: false }
          - { label: "Inhoud", name: "body", widget: "markdown" }
      - label: "Over Ons"
        name: "over-ons"
        file: "content/over-ons/index.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Inhoud", name: "body", widget: "markdown" }
      - label: "Archief"
        name: "archief"
        file: "content/archief/_index.md"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "list" }
          - { label: "Type", name: "type", widget: "hidden", default: "archief" }
          - { label: "Inhoud", name: "body", widget: "markdown", required: false }

