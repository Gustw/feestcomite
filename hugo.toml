baseURL = "https://feestcomitesintdenijs.be/"
languageCode = "nl"
title = "Feestcomite Sint-Denijs"
theme = "feestcomite-theme"
buildFuture = true

[params]
  description = "Het feestcomité van Sint-Denijs organiseert jaarlijks enkele gezellige dorpsevenementen."
  author = "Feestcomite Sint-Denijs"
  # Bij hoofdletters: FEESTCOMITE (met E, zonder accent)
  titleUppercase = "FEESTCOMITE SINT-DENIJS"

[params.colors]
  primary = "#472714"
  secondary = "#EFBEAC"
  cream = "#FBF8CE"
  peach = "#EFBEAC"
  brown = "#472714"
  accent = "#FF3D17"

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Evenementen"
    url = "/evenementen/"
    weight = 2
  [[menu.main]]
    name = "Archief"
    url = "/archief/"
    weight = 3
  [[menu.main]]
    name = "Over ons"
    url = "/over-ons/"
    weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML"]

[taxonomies]
  tag = "tags"
  categorie = "categorieen"

